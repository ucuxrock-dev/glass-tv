name: build-apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x launcher/gradlew && cd launcher && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: glass-tv-apk
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
